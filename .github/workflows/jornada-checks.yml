name: Plataforma SindPetshop - verificações
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/modo-roteirizador-auditoria-ux]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código (somente leitura)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências sem executar scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testar pesquisa de CNPJ no Cadastro
        run: npm run test:cadastro
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Verificar ESLint
        run: npm run lint
      - name: Compilar Next.js com configuração sintética (sem dados reais)
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_NEON_AUTH_BASE_URL: https://ci-auth.example.com
          NEON_AUTH_COOKIE_SECRET: ci-only-dummy-cookie-secret-not-for-production-123456
          OPENROUTESERVICE_API_KEY: ci-dummy-no-api-requests
        run: npm run build
      - name: Smoke HTTP de todas as telas e fotos de login
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_NEON_AUTH_BASE_URL: https://ci-auth.example.com
          NEON_AUTH_COOKIE_SECRET: ci-only-dummy-cookie-secret-not-for-production-123456
          OPENROUTESERVICE_API_KEY: ci-dummy-no-api-requests
          SMOKE_BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          npm run start -- --port 3100 > /tmp/sind-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS "$SMOKE_BASE_URL/login" >/dev/null; then break; fi
            sleep 1
          done
          npm run test:smoke || { cat /tmp/sind-next.log; exit 1; }
